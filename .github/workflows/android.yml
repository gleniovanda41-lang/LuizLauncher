name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Dependencies (LTW & Runtimes)
        run: |
          # 1. Baixa o LTW (biblioteca necessária para renderização)
          mkdir -p app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar -O app_pojavlauncher/libs/ltw-release.aar
          
          # 2. Cria as pastas dos Runtimes
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          
          # 3. Baixa os Runtimes (Usando links diretos de confiança)
          # NOTA: Certifique-se de que esses links estão ativos ou aponte para suas próprias Releases
          wget -q https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/buildjre8/jre8-arm64.tar.xz -O jre8.tar.xz
          wget -q https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/buildjre17-21/jre17-arm64.tar.xz -O jre17.tar.xz
          
          # 4. Extrai para as pastas do projeto
          tar -xf jre8.tar.xz -C app_pojavlauncher/src/main/assets/components/jre
          tar -xf jre17.tar.xz -C app_pojavlauncher/src/main/assets/components/jre-new

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuizLauncher-Debug
          path: app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          
