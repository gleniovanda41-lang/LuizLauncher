
          
name: LuizLauncher Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Adicionamos o cache para o Gradle não baixar tudo de novo
          cache: 'gradle'

      - name: Build com Force Offline
        run: |
          chmod +x gradlew
          # O parâmetro --offline faz o Gradle usar apenas o que já está baixado
          ./gradlew :app_pojavlauncher:assembleDebug --offline

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuizLauncher-Offline
          path: app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          
